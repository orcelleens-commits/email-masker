<!DOCTYPE html>
<html>
<head>
  <title>Email Masker</title>
</head>
<body>

<h1>Email Masker</h1>

<input type="text" id="emailInput" placeholder="Enter your email">

<button onclick="showMaskedEmail()">
  Mask Email
</button>

<p>Masked Email:</p>

<div id="output"></div>

<script>
function maskEmail(email) {
  let atIndex = email.indexOf("@");

  let userName = email.slice(0, atIndex);

  let domain = email.slice(atIndex);

  let firstLetter = userName[0];

  let lastLetter = userName[userName.length - 1];

  let stars = "*".repeat(userName.length - 2);

  return firstLetter + stars + lastLetter + domain;
}

function showMaskedEmail() {

  // get text from input
  let email = document.getElementById("emailInput").value;

  // mask email
  let result = maskEmail(email);

  // show result on page
  document.getElementById("output").innerHTML = result;
}
</script>

</body>
</html>
